<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidak ada internet · Catatan Uang</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f7f8;
        color: #1c1f23;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.125rem; margin: 0 0 8px; }
      p { margin: 0; color: #6b7280; font-size: 0.875rem; line-height: 1.5; }
      button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #0b7d55;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tidak ada internet</h1>
      <p>Catatan Uang butuh koneksi untuk menampilkan data. Sambungkan internet, lalu coba lagi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
